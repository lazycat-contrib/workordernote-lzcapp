version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: workordernote

build:
  toolchains: []
  run_buildscript: false

images:
  - id: workordernote
    target: service
    service: workordernote
    source: ghcr.io/magicindex/workordernote
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 打工记
    summary: 打工人的待办提醒助手，支持农历重复与多渠道提醒
